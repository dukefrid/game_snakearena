<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Item Arena Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; touch-action: none; }
        
        #ui-layer {
            position: absolute; top: 20px; right: 20px;
            color: white; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
            pointer-events: none; display: none; flex-direction: column; align-items: flex-end; z-index: 10;
        }
        .top-row { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        #score-display { font-size: 24px; }
        .buff-text { font-size: 18px; margin-top: 5px; text-align: right; }
        .buff-magnet { color: #3498db; } .buff-speed { color: #f1c40f; } .buff-vision { color: #9b59b6; }
        .buff-invincible { color: #f39c12; text-shadow: 0 0 8px #f39c12; } .buff-gun { color: #e74c3c; text-shadow: 0 0 8px #e74c3c; } .buff-spike { color: #bdc3c7; text-shadow: 0 0 8px #bdc3c7; }
        
        #leaderboard {
            margin-top: 20px; background-color: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 10px; width: 180px; text-align: left;
        }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 18px; color: #ffd700; text-align: center; }
        #leaderboard ol { margin: 0; padding-left: 25px; font-size: 16px; }
        #leaderboard li { margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .my-rank { color: #ff6b6b; font-weight: bold; text-shadow: 0 0 5px #ff6b6b; }
        .remote-rank { color: #3498db; font-weight: bold; text-shadow: 0 0 5px #3498db; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(26, 26, 46, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white;
        }
        #start-screen h1 { font-size: 50px; color: #ff6b6b; text-shadow: 0 0 20px rgba(255, 107, 107, 0.5); margin-bottom: 5px; text-align: center; }
        .version-text { font-size: 18px; color: #888; margin-bottom: 30px; letter-spacing: 2px; font-weight: bold; }
        
        .menu-group { margin-bottom: 20px; display: flex; flex-direction: column; align-items: flex-start; width: 300px; }
        .menu-group label { margin-bottom: 5px; font-size: 18px; color: #ccc; }
        .menu-group input[type="text"], .menu-group select { width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; border: none; box-sizing: border-box; }
        .menu-group input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 5px; cursor: pointer; background: none; }
        
        .radio-group { display: flex; gap: 15px; width: 100%; font-size: 18px; margin-bottom: 10px; justify-content: center;}
        .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: white;}
        
        .menu-btn { padding: 15px 30px; font-size: 22px; font-weight: bold; background-color: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px;}
        .menu-btn:hover { background-color: #ff4c4c; transform: scale(1.02); }
        .btn-blue { background-color: #3498db; } .btn-blue:hover { background-color: #2980b9; }

        #multiplayer-ui { display: none; width: 300px; text-align: center; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px;}
        .pin-display { font-size: 36px; color: #ffd700; letter-spacing: 5px; margin: 15px 0; text-shadow: 0 0 10px #ffd700; }
        #join-input { text-align: center; font-size: 24px; letter-spacing: 5px; text-transform: uppercase; }

        #controls-layer { display: none; gap: 10px; }
        .ctrl-btn { pointer-events: auto; padding: 8px 12px; font-size: 14px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 2px solid #fff; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .ctrl-btn:hover { background-color: #ff6b6b; border-color: #ff6b6b; }

        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center;
        }
        #game-over-screen h2 { font-size: 60px; color: #ff3333; text-shadow: 0 0 20px #ff3333; margin-bottom: 10px; }
        #game-over-screen p { font-size: 30px; margin-bottom: 40px; color: #fff; text-shadow: 2px 2px 5px #000; }
        .btn-group { display: flex; gap: 20px; }
        .quit-btn { background-color: #7f8c8d; } .quit-btn:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>🐍 Snake Item Arena</h1>
        <div class="version-text">ver 1.06 (Single Fix)</div>
        
        <div class="menu-group">
            <label>Game Mode</label>
            <div class="radio-group">
                <label><input type="radio" name="mode" value="arena" checked> 아레나 (싱글)</label>
                <label><input type="radio" name="mode" value="1v1"> 1:1 대전</label>
            </div>
        </div>

        <div class="menu-group">
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" maxlength="12">
        </div>
        <div class="menu-group">
            <label for="skin-color">Skin Color</label>
            <input type="color" id="skin-color" value="#ff6b6b">
        </div>

        <button id="start-btn" class="menu-btn">Game Start</button>

        <div id="multiplayer-ui">
            <button id="btn-create-room" class="menu-btn">방 만들기 (Host)</button>
            <div id="host-wait" style="display: none;">
                <p>입장 코드를 친구에게 알려주세요!</p>
                <div id="room-pin" class="pin-display">----</div>
                <p style="font-size: 14px; color: #aaa;">접속 대기 중...</p>
            </div>
            <hr style="border-color: #555; margin: 20px 0;">
            <button id="btn-join-room" class="menu-btn btn-blue">입장하기 (Join)</button>
            <div id="join-wait" style="display: none; margin-top: 15px;">
                <input type="text" id="join-input" maxlength="4" placeholder="CODE">
                <button id="btn-connect-room" class="menu-btn btn-blue" style="margin-top: 10px;">접속</button>
                <p id="join-status" style="font-size: 14px; color: #ff6b6b; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <div id="ui-layer">
        <div class="top-row">
            <div id="controls-layer">
                <button id="pause-btn" class="ctrl-btn">⏸ Pause</button>
                <button id="fullscreen-btn" class="ctrl-btn">⛶ Full Screen</button>
            </div>
            <div id="score-display">Score: <span id="score">0</span></div>
        </div>
        <div id="buff-status"></div>
        <div id="leaderboard">
            <h3>🏆 Leaderboard</h3>
            <ol id="leaderboard-list"></ol>
        </div>
    </div>

    <div id="game-over-screen">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <div class="btn-group">
            <button id="continue-btn" class="menu-btn" style="display:none;">Continue (이어하기)</button>
            <button id="quit-btn" class="menu-btn quit-btn">Quit (타이틀로)</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const randomId = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('nickname').value = 'Player_' + randomId;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const WORLD_SIZE = 3000;
        const FOOD_COUNT = 200; 
        const ENEMY_COUNT = 10;
        const BOT_NAMES = ['Alpha', 'Beta', 'Gamma', 'Viper', 'Cobra', 'Python', 'Kraken'];

        let gameMode = 'arena'; 
        let isPlaying = false;
        let isPaused = false; 
        let mouse = { x: canvas.width / 2, y: canvas.height / 2, angle: 0 };
        let currentZoom = 1.0; 
        let lastPlayerDeathX = WORLD_SIZE / 2;
        let lastPlayerDeathY = WORLD_SIZE / 2;

        let snake;         
        let remoteSnake;   
        let foods = [];
        let enemies = [];
        let items = [];
        let particles = []; 
        let bullets = []; 
        let allSnakes = []; 
        let itemSpawnInterval;
        let gameLoopId = null; 

        let peer = null;
        let p2pConnection = null;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        const explosionSound = new Audio('explosion.mp3');
        const myExplosionSound = new Audio('myExplosion.mp3');
        const bgmSound = new Audio('snake_bgm.mp3');
        bgmSound.loop = true; bgmSound.volume = 0.3;

        function safePlayBGM() {
            try {
                bgmSound.currentTime = 0;
                let promise = bgmSound.play();
                if (promise !== undefined) {
                    promise.catch(e => console.warn("BGM Play Error:", e));
                }
            } catch(e) { console.warn("BGM handling error", e); }
        }

        function initAudio() {
            try {
                if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) { console.warn("Audio Context init failed:", e); }
        }

        function playSound(type) {
            try {
                if (type === 'enemy_death') { let snd = explosionSound.cloneNode(); snd.play().catch(()=>{}); return; }
                if (type === 'player_death') { let snd = myExplosionSound.cloneNode(); snd.play().catch(()=>{}); return; }
                
                if (!audioCtx) return;
                const gainNode = audioCtx.createGain(); gainNode.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'item') {
                    const osc = audioCtx.createOscillator(); osc.connect(gainNode); osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'shoot') {
                    const osc = audioCtx.createOscillator(); osc.connect(gainNode); osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
                    gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            } catch(e) { console.warn("Sound play failed:", e); }
        }

        window.addEventListener('mousemove', (e) => { 
            mouse.x = e.clientX; mouse.y = e.clientY; 
            mouse.angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
        });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        window.addEventListener('touchstart', (e) => { if(e.target===canvas) e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);}, { passive: false });
        window.addEventListener('touchmove', (e) => { if(e.target===canvas) e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);}, { passive: false });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); document.getElementById('fullscreen-btn').innerText = "✖ Exit"; } 
            else { document.exitFullscreen(); document.getElementById('fullscreen-btn').innerText = "⛶ Full"; }
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            if (!isPlaying || (snake && snake.isDead) || gameMode === 'client') return; 
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? "▶ Resume" : "⏸ Pause";
            if (isPaused) bgmSound.pause(); else bgmSound.play().catch(()=>{});
        });

        const radios = document.querySelectorAll('input[name="mode"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'arena') {
                    document.getElementById('start-btn').style.display = 'block';
                    document.getElementById('multiplayer-ui').style.display = 'none';
                } else {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('multiplayer-ui').style.display = 'block';
                }
            });
        });

        // -------------------------------------------------------------
        // 나으리의 명령에 따라 멀티플레이 버그는 수정하지 않고 원본 그대로 둡니다.
        // -------------------------------------------------------------
        function initPeer(pin, isHost) {
            const peerId = 'snake201-' + pin;
            
            peer = new Peer(peerId, {
                host: 'game-snakearena.onrender.com', 
                port: 443,
                secure: true,
                path: '/'
            });

            if (isHost) {
                peer.on('open', id => { console.log('Host created:', id); });
                peer.on('connection', conn => {
                    p2pConnection = conn;
                    setupHostConnection();
                });
            } else {
                peer.on('open', () => {
                    p2pConnection = peer.connect(peerId);
                    setupClientConnection();
                });
                peer.on('error', err => {
                    document.getElementById('join-status').innerText = "방을 찾을 수 없습니다!";
                });
            }
        }

        document.getElementById('btn-create-room').addEventListener('click', () => {
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('room-pin').innerText = pin;
            document.getElementById('btn-create-room').style.display = 'none';
            document.getElementById('btn-join-room').style.display = 'none';
            document.getElementById('host-wait').style.display = 'block';
            initPeer(pin, true);
        });

        document.getElementById('btn-join-room').addEventListener('click', () => {
            document.getElementById('btn-create-room').style.display = 'none';
            document.getElementById('btn-join-room').style.display = 'none';
            document.getElementById('join-wait').style.display = 'block';
        });

        document.getElementById('btn-connect-room').addEventListener('click', () => {
            const pin = document.getElementById('join-input').value;
            if(pin.length === 4) initPeer(pin, false);
        });

        function setupHostConnection() {
            p2pConnection.on('open', () => {
                p2pConnection.on('data', data => {
                    if (data.type === 'init') {
                        startGame('host', data.nickname, data.color);
                    } else if (data.type === 'input' && remoteSnake && !remoteSnake.isDead) {
                        remoteSnake.angle = data.angle;
                    } else if (data.type === 'continue' && remoteSnake) {
                        remoteSnake = createSnake(WORLD_SIZE/2 + 200, WORLD_SIZE/2, remoteSnake.color, remoteSnake.name, true);
                        remoteSnake.buffs.invincible = Date.now() + 3000;
                        allSnakes.push(remoteSnake); 
                    }
                });
            });
        }

        function setupClientConnection() {
            p2pConnection.on('open', () => {
                gameMode = 'client';
                const nickname = document.getElementById('nickname').value || 'Player';
                const skinColor = document.getElementById('skin-color').value;
                p2pConnection.send({ type: 'init', nickname: nickname, color: skinColor });

                initGameUI();
                
                p2pConnection.on('data', data => {
                    if (data.type === 'state') {
                        foods = data.foods; items = data.items; bullets = data.bullets; particles = data.particles;
                        allSnakes = data.snakes;
                        snake = allSnakes.find(s => s.name === nickname);
                        updateLeaderboard(allSnakes);
                        renderClient();
                    } else if (data.type === 'sound') {
                        playSound(data.soundType);
                    }
                });

                setInterval(() => {
                    if (isPlaying && !isPaused && snake && !snake.isDead) {
                        p2pConnection.send({ type: 'input', angle: mouse.angle });
                    }
                }, 1000 / 30);
            });
        }
        // -------------------------------------------------------------

        document.getElementById('start-btn').addEventListener('click', () => startGame('arena'));

        function startGame(mode, remoteName = null, remoteColor = null) {
            initAudio(); 
            safePlayBGM();

            gameMode = mode;
            const nickname = document.getElementById('nickname').value || 'Player';
            const skinColor = document.getElementById('skin-color').value;

            foods = []; enemies = []; items = []; particles = []; bullets = []; allSnakes = [];
            isPaused = false; 
            clearInterval(itemSpawnInterval);
            if (gameLoopId) cancelAnimationFrame(gameLoopId);

            snake = createSnake(WORLD_SIZE / 2, WORLD_SIZE / 2, skinColor, nickname, true);
            snake.buffs.invincible = Date.now() + 3000; 
            allSnakes.push(snake);

            if (gameMode === 'host' && remoteName) {
                remoteSnake = createSnake(WORLD_SIZE / 2 + 100, WORLD_SIZE / 2, remoteColor, remoteName, true);
                remoteSnake.buffs.invincible = Date.now() + 3000;
                allSnakes.push(remoteSnake);
            }

            for (let i = 0; i < FOOD_COUNT; i++) spawnFood();
            for (let i = 0; i < ENEMY_COUNT; i++) {
                let bot = spawnEnemy(4);
                enemies.push(bot);
                allSnakes.push(bot);
            }

            itemSpawnInterval = setInterval(spawnItem, 5000);
            initGameUI();
            
            if (gameMode !== 'client') {
                gameLoopId = requestAnimationFrame(hostGameLoop);
            }
        }

        function initGameUI() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('controls-layer').style.display = 'flex'; 
            isPlaying = true;
            document.getElementById('score').innerText = "0";
            document.getElementById('continue-btn').style.display = 'block'; 
        }

        document.getElementById('continue-btn').addEventListener('click', () => {
            initAudio(); safePlayBGM();
            
            if (gameMode === 'client') {
                p2pConnection.send({ type: 'continue' });
            } else {
                const nickname = document.getElementById('nickname').value || 'Player';
                const skinColor = document.getElementById('skin-color').value;
                snake = createSnake(lastPlayerDeathX, lastPlayerDeathY, skinColor, nickname, true);
                snake.buffs.invincible = Date.now() + 3000;
                allSnakes.push(snake); 
            }

            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('controls-layer').style.display = 'flex'; 
            isPaused = false; document.getElementById('pause-btn').innerText = "⏸ Pause";
        });

        document.getElementById('quit-btn').addEventListener('click', () => {
            window.location.reload(); 
        });

        function showGameOver(finalScore) {
            bgmSound.pause(); 
            document.getElementById('final-score').innerText = Math.floor(finalScore);
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('controls-layer').style.display = 'none'; 
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function createSnake(x, y, color, name, isPlayer = false, baseSpeed = 4) {
            return {
                x: x, y: y, radius: 15, baseSpeed: baseSpeed, speed: baseSpeed,
                history: [], tailLength: 10, color: color, isPlayer: isPlayer, name: name,
                angle: Math.random() * Math.PI * 2, score: 0, turnDirection: null, isDead: false,
                buffs: { magnet: 0, speed: 0, vision: 0, invincible: 0, gun: 0, spike: 0 },
                lastShootTime: 0
            };
        }
        function spawnFood(x, y, isBig = false, customRadius = null, isCorpse = false) {
            let r = isBig ? (Math.random() * 5 + 10) : (Math.random() * 4 + 4);
            if (customRadius) r = customRadius;
            foods.push({ x: x || Math.random() * WORLD_SIZE, y: y || Math.random() * WORLD_SIZE, radius: r, color: `hsl(${Math.random() * 360}, 100%, 70%)`, isBig: isBig, customRadius: customRadius, isCorpse: isCorpse });
        }
        function spawnEnemy(speed = 4) {
            const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            return createSnake(Math.random() * WORLD_SIZE, Math.random() * WORLD_SIZE, `hsl(${Math.random() * 360}, 80%, 60%)`, name, false, speed);
        }
        function spawnItem() {
            if (items.length > 5 || isPaused) return; 
            const types = ['magnet', 'speed', 'vision', 'invincible', 'gun', 'spike']; 
            items.push({ type: types[Math.floor(Math.random() * types.length)], x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, radius: 36 });
        }
        function createExplosion(x, y, baseColor, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 8 + 2; 
                particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 6 + 3, color: Math.random() > 0.5 ? baseColor : '#ffffff', life: 1.0, decay: Math.random() * 0.03 + 0.02 });
            }
        }
        function checkBodyCollision(x, y, radius, bodySnake, now) {
            let hitRadius = bodySnake.radius * 0.8;
            if (now && now < bodySnake.buffs.spike) hitRadius = bodySnake.radius * 4; 
            for (let i = 0; i < Math.floor(bodySnake.tailLength); i++) {
                const historyIndex = i * 4;
                if (historyIndex < bodySnake.history.length) {
                    const pos = bodySnake.history[historyIndex];
                    if (Math.hypot(x - pos.x, y - pos.y) < radius + hitRadius) return true;
                }
            }
            return false;
        }
        function broadcastSound(type) {
            playSound(type);
            if (gameMode === 'host' && p2pConnection) p2pConnection.send({ type: 'sound', soundType: type });
        }
        
        function die(deadSnake) {
            if (deadSnake.isDead) return;
            deadSnake.isDead = true;

            if (deadSnake.isPlayer) {
                broadcastSound('player_death');
                if(deadSnake === snake) {
                    lastPlayerDeathX = Math.max(100, Math.min(WORLD_SIZE - 100, deadSnake.x));
                    lastPlayerDeathY = Math.max(100, Math.min(WORLD_SIZE - 100, deadSnake.y));
                    showGameOver(snake.score);
                } 
            } else {
                broadcastSound('enemy_death');
                setTimeout(() => {
                    if(!isPaused && isPlaying) {
                        let bot = spawnEnemy(4);
                        enemies.push(bot); allSnakes.push(bot);
                    }
                }, 2000); 
            }
             
            createExplosion(deadSnake.x, deadSnake.y, deadSnake.color, 40);
            for (let i = 0; i < Math.floor(deadSnake.tailLength); i += 2) {
                const hIndex = i * 4;
                if (hIndex < deadSnake.history.length) {
                    const pos = deadSnake.history[hIndex];
                    spawnFood(pos.x, pos.y, true, deadSnake.radius * 0.8, true); 
                    createExplosion(pos.x, pos.y, deadSnake.color, 5); 
                }
            }
        }

        function updateHostLogic() {
            if (!isPlaying || isPaused) return; 
            const now = Date.now();

            if (snake && !snake.isDead) snake.angle = mouse.angle;

            for (let i = allSnakes.length - 1; i >= 0; i--) {
                let s = allSnakes[i];
                if (!s || s.isDead) continue;

                const isInvincible = now < s.buffs.invincible;
                s.speed = (now < s.buffs.speed) ? s.baseSpeed * 1.3 : s.baseSpeed;

                if (!s.isPlayer) {
                    if (!isInvincible) {
                        let lookAhead = s.radius * 5; 
                        let futureX = s.x + Math.cos(s.angle) * lookAhead;
                        let futureY = s.y + Math.sin(s.angle) * lookAhead;
                        let danger = false;
                        if (futureX < s.radius || futureX > WORLD_SIZE - s.radius || futureY < s.radius || futureY > WORLD_SIZE - s.radius) danger = true;
                        if (!danger) {
                            for(let tgt of allSnakes) {
                                if(s !== tgt && !tgt.isDead && checkBodyCollision(futureX, futureY, s.radius, tgt, now)) { danger=true; break;}
                            }
                        }
                        if (danger) {
                            if (!s.turnDirection) s.turnDirection = Math.random() < 0.5 ? 1 : -1;
                            s.angle += s.turnDirection * 0.3; 
                        } else {
                            s.turnDirection = null; 
                            let target = null; let minDist = 400; 
                            for (let obj of [...foods, ...items]) {
                                let d = Math.hypot(s.x - obj.x, s.y - obj.y);
                                if (d < minDist) { minDist = d; target = obj; }
                            }
                            if (target) {
                                let aDiff = Math.atan2(target.y - s.y, target.x - s.x) - s.angle;
                                aDiff = Math.atan2(Math.sin(aDiff), Math.cos(aDiff));
                                s.angle += Math.max(-0.06, Math.min(0.06, aDiff)); 
                            } else { s.angle += (Math.random() - 0.5) * 0.1; }
                        }
                    }
                }

                s.x += Math.cos(s.angle) * s.speed; s.y += Math.sin(s.angle) * s.speed;
                let hitWall = false;
                if (s.x < s.radius || s.x > WORLD_SIZE - s.radius || s.y < s.radius || s.y > WORLD_SIZE - s.radius) { 
                    hitWall = true; if (isInvincible && !s.isPlayer) s.angle += Math.PI; 
                }
                s.x = Math.max(s.radius, Math.min(WORLD_SIZE - s.radius, s.x));
                s.y = Math.max(s.radius, Math.min(WORLD_SIZE - s.radius, s.y));
                s.history.unshift({ x: s.x, y: s.y });
                if (s.history.length > Math.floor(s.tailLength) * 4 + 10) s.history.pop();

                let killed = false;
                if (isInvincible) {
                    for (let tgt of allSnakes) {
                        if (s !== tgt && !tgt.isDead && !(now < tgt.buffs.invincible)) {
                            if (checkBodyCollision(s.x, s.y, s.radius, tgt, now) || Math.hypot(s.x - tgt.x, s.y - tgt.y) < s.radius + tgt.radius) {
                                die(tgt);
                            }
                        }
                    }
                } else if (hitWall) {
                    die(s); killed = true;
                } else {
                    for (let tgt of allSnakes) {
                        if (s !== tgt && !tgt.isDead) {
                            if (checkBodyCollision(s.x, s.y, s.radius, tgt, now) || (now < tgt.buffs.spike && Math.hypot(s.x - tgt.x, s.y - tgt.y) < s.radius + tgt.radius * 4)) {
                                die(s); killed = true; break;
                            }
                        }
                    }
                }

                if (!killed && now < s.buffs.gun && now - s.lastShootTime > 300) {
                    bullets.push({ x: s.x + Math.cos(s.angle)*(s.radius+5), y: s.y + Math.sin(s.angle)*(s.radius+5), vx: Math.cos(s.angle)*15, vy: Math.sin(s.angle)*15, radius: 6, color: '#ff3300', owner: s });
                    s.lastShootTime = now;
                    if(s.isPlayer) broadcastSound('shoot');
                }
                
                if (!killed && now < s.buffs.spike) {
                    for (let tgt of allSnakes) {
                        if (s !== tgt && !tgt.isDead && !(now < tgt.buffs.invincible)) {
                            if (checkBodyCollision(tgt.x, tgt.y, tgt.radius, s, now) || Math.hypot(tgt.x - s.x, tgt.y - s.y) < tgt.radius + s.radius * 4) {
                                die(tgt);
                            }
                        }
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) { bullets.splice(i, 1); continue; }

                let hit = false;
                for (let tgt of allSnakes) {
                    if (b.owner === tgt || tgt.isDead) continue;
                    if (Math.hypot(b.x - tgt.x, b.y - tgt.y) < b.radius + tgt.radius || checkBodyCollision(b.x, b.y, b.radius, tgt, now)) {
                        if (!(now < tgt.buffs.invincible)) die(tgt);
                        createExplosion(b.x, b.y, '#ff3300', 10); 
                        hit = true; break;
                    }
                }
                if (hit) bullets.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let pickedUp = false;
                for (let s of allSnakes) {
                    if (!s.isDead && Math.hypot(s.x - items[i].x, s.y - items[i].y) < s.radius + items[i].radius) {
                        s.buffs[items[i].type] = now + 10000; pickedUp = true;
                        if (s.isPlayer) broadcastSound('item'); 
                        break;
                    }
                }
                if (pickedUp) items.splice(i, 1);
            }

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                for (let s of allSnakes) {
                    if (!s.isDead && now < s.buffs.magnet && Math.hypot(s.x - f.x, s.y - f.y) < 250) {
                        let a = Math.atan2(s.y - f.y, s.x - f.x); f.x += Math.cos(a) * 8; f.y += Math.sin(a) * 8;
                    }
                }
                let eaten = false;
                for (let s of allSnakes) {
                    if (!s.isDead && Math.hypot(s.x - f.x, s.y - f.y) < s.radius + f.radius) {
                        foods.splice(i, 1);
                        let rate = f.isBig ? (f.customRadius ? f.customRadius*0.045 : 0.6) : 0.15;
                        let inc = f.isBig ? (f.customRadius ? f.customRadius*0.02 : 0.2) : 0.05;
                        let scoreAdd = f.isBig ? (f.customRadius ? Math.floor(f.customRadius*5) : 50) : 10;
                        s.tailLength += rate; s.radius = Math.min(60, s.radius + inc); s.score += scoreAdd;
                        if(s === snake) document.getElementById('score').innerText = Math.floor(s.score);
                        if (foods.length < FOOD_COUNT) spawnFood(); 
                        eaten = true; break;
                    }
                }
                if (eaten) continue;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.radius *= 0.95; 
                if (p.life <= 0 || p.radius < 0.5) particles.splice(i, 1);
            }

            allSnakes = allSnakes.filter(s => !s.isDead);
            enemies = enemies.filter(s => !s.isDead);
            updateLeaderboard(allSnakes);

            if (gameMode === 'host' && p2pConnection) {
                const stateData = {
                    type: 'state',
                    snakes: allSnakes.map(s => ({
                        x: s.x, y: s.y, radius: s.radius, color: s.color, name: s.name, angle: s.angle,
                        tailLength: s.tailLength, history: s.history, isDead: s.isDead, score: s.score, buffs: s.buffs, isPlayer: s.isPlayer
                    })),
                    foods: foods, items: items, bullets: bullets, particles: particles
                };
                p2pConnection.send(stateData);
            }
        }

        // ==============================================================
        // 핵심 수정 사항: 그리기 과정 중 에러가 나더라도 무조건 기준점을 복구하여
        // 다음 프레임에서 화면이 통째로 까맣게 굳어버리는 치명적 오류를 방지합니다.
        // ==============================================================
        function renderClient() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!isPlaying) return;

            const time = Date.now();
            let targetZoom = 1.0;
            
            if (snake && !snake.isDead) {
                if(time < snake.buffs.vision) targetZoom = 1 / 1.5;
                
                let buffText = "";
                if (time < snake.buffs.magnet) buffText += `<div class="buff-text buff-magnet">🧲 Magnet: ${Math.ceil((snake.buffs.magnet - time)/1000)}s</div>`;
                if (time < snake.buffs.speed) buffText += `<div class="buff-text buff-speed">UP Speed: ${Math.ceil((snake.buffs.speed - time)/1000)}s</div>`;
                if (time < snake.buffs.vision) buffText += `<div class="buff-text buff-vision">🔭 Vision: ${Math.ceil((snake.buffs.vision - time)/1000)}s</div>`;
                if (time < snake.buffs.invincible) buffText += `<div class="buff-text buff-invincible">⭐ Invincible: ${Math.ceil((snake.buffs.invincible - time)/1000)}s</div>`;
                if (time < snake.buffs.gun) buffText += `<div class="buff-text buff-gun">🔫 Gun: ${Math.ceil((snake.buffs.gun - time)/1000)}s</div>`;
                if (time < snake.buffs.spike) buffText += `<div class="buff-text buff-spike">✹ Spikes: ${Math.ceil((snake.buffs.spike - time)/1000)}s</div>`;
                buffStatusElement.innerHTML = buffText;
                
                if(gameMode === 'client') document.getElementById('score').innerText = Math.floor(snake.score);
            }

            if (!isPaused && isPlaying) currentZoom += (targetZoom - currentZoom) * 0.05;

            ctx.save();
            try {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(currentZoom, currentZoom);
                
                if(snake) {
                    if (snake.isDead) ctx.translate(-lastPlayerDeathX, -lastPlayerDeathY);
                    else ctx.translate(-snake.x, -snake.y);
                }

                ctx.strokeStyle = '#2a2a4e'; ctx.lineWidth = 2;
                const gridSize = 100;
                if(snake) {
                    const visW = canvas.width / currentZoom; const visH = canvas.height / currentZoom;
                    let vL = (snake.isDead ? lastPlayerDeathX : snake.x) - visW / 2;
                    let vT = (snake.isDead ? lastPlayerDeathY : snake.y) - visH / 2;
                    for (let x = Math.floor(vL/gridSize)*gridSize - gridSize; x < vL + visW + gridSize; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, vT - gridSize); ctx.lineTo(x, vT + visH + gridSize); ctx.stroke(); }
                    for (let y = Math.floor(vT/gridSize)*gridSize - gridSize; y < vT + visH + gridSize; y += gridSize) { ctx.beginPath(); ctx.moveTo(vL - gridSize, y); ctx.lineTo(vL + visW + gridSize, y); ctx.stroke(); }
                }
                ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 15; ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

                particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color; ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1.0; });
                bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.shadowBlur = 15; ctx.shadowColor = '#ffff00'; ctx.fill(); ctx.shadowBlur = 0; });
                items.forEach(item => {
                    const spk = Math.abs(Math.sin(time / 200)); ctx.beginPath(); ctx.arc(item.x, item.y, item.radius, 0, Math.PI*2);
                    ctx.fillStyle = item.type==='magnet'?'#3498db':item.type==='speed'?'#f1c40f':item.type==='vision'?'#9b59b6':item.type==='invincible'?'#f39c12':item.type==='gun'?'#e74c3c':'#95a5a6';
                    ctx.shadowBlur = 10 + 20*spk; ctx.shadowColor = 'white'; ctx.fill(); ctx.shadowBlur = 0;
                    let icon = item.type==='magnet'?'🧲':item.type==='speed'?'UP':item.type==='vision'?'🔭':item.type==='invincible'?'⭐':item.type==='gun'?'🔫':'✹';
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + 0.4 * spk})`; ctx.font = item.type==='speed'?'bold 24px Arial':'30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(icon, item.x, item.y);
                });
                foods.forEach(f => {
                    ctx.beginPath(); 
                    if (f.isCorpse) { const spk = Math.abs(Math.sin((isPaused?0:time) / 150 + f.x)); ctx.arc(f.x, f.y, f.radius + (spk*2), 0, Math.PI*2); ctx.fillStyle = f.color; ctx.shadowBlur = 15 + 15*spk; ctx.shadowColor = 'white'; } 
                    else { ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2); ctx.fillStyle = f.color; ctx.shadowBlur = f.isBig ? 15 : 5; ctx.shadowColor = f.color; }
                    ctx.fill(); ctx.shadowBlur = 0;
                });

                allSnakes.forEach(s => {
                    if (!s || s.isDead) return;
                    const isInv = (time < s.buffs.invincible); const invSpk = isInv ? Math.abs(Math.sin(time / 100)) : 0; const isSpk = (time < s.buffs.spike);

                    for (let i = Math.floor(s.tailLength) - 1; i >= 0; i--) {
                        const hIdx = i * 4; 
                        if (hIdx < s.history.length) {
                            const pos = s.history[hIdx];
                            if (isSpk && i % 2 === 0) {
                                ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 4; ctx.beginPath();
                                for(let j=0; j<4; j++) { let a = (Math.PI/4)*j + (time/500); let dx = Math.cos(a)*(s.radius*4); let dy = Math.sin(a)*(s.radius*4); ctx.moveTo(pos.x-dx, pos.y-dy); ctx.lineTo(pos.x+dx, pos.y+dy); } ctx.stroke();
                            }
                            ctx.beginPath(); ctx.arc(pos.x, pos.y, s.radius * 0.9, 0, Math.PI*2);
                            ctx.fillStyle = i%2===0 ? (s.isPlayer?'#cc5555':'#444') : s.color;
                            if (isInv) { ctx.shadowBlur = 20*invSpk; ctx.shadowColor = '#ffff00'; }
                            ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                        }
                    }
                    
                    if (isSpk) {
                        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 4; ctx.beginPath();
                        for(let j=0; j<4; j++) { let a = (Math.PI/4)*j + (time/500); let dx = Math.cos(a)*(s.radius*4); let dy = Math.sin(a)*(s.radius*4); ctx.moveTo(s.x-dx, s.y-dy); ctx.lineTo(s.x+dx, s.y+dy); } ctx.stroke();
                    }

                    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctx.fillStyle = s.color; 
                    if (isInv) { ctx.shadowBlur = 20*invSpk; ctx.shadowColor = '#ffff00'; } ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
                    
                    const eOff = s.radius*0.5; const eRad = s.radius*0.25;
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(s.x+Math.cos(s.angle-0.5)*eOff, s.y+Math.sin(s.angle-0.5)*eOff, eRad, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(s.x+Math.cos(s.angle+0.5)*eOff, s.y+Math.sin(s.angle+0.5)*eOff, eRad, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(s.x+Math.cos(s.angle-0.5)*eOff, s.y+Math.sin(s.angle-0.5)*eOff, eRad/2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(s.x+Math.cos(s.angle+0.5)*eOff, s.y+Math.sin(s.angle+0.5)*eOff, eRad/2, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineWidth = 3; ctx.strokeStyle = 'black'; ctx.strokeText(s.name, s.x, s.y - s.radius - 8); ctx.fillText(s.name, s.x, s.y - s.radius - 8);

                    let aIcons = [];
                    if (s.buffs.magnet > time) aIcons.push(`🧲 ${Math.ceil((s.buffs.magnet - time)/1000)}`);
                    if (s.buffs.speed > time) aIcons.push(`UP ${Math.ceil((s.buffs.speed - time)/1000)}`);
                    if (s.buffs.vision > time) aIcons.push(`🔭 ${Math.ceil((s.buffs.vision - time)/1000)}`);
                    if (s.buffs.invincible > time) aIcons.push(`⭐ ${Math.ceil((s.buffs.invincible - time)/1000)}`);
                    if (s.buffs.gun > time) aIcons.push(`🔫 ${Math.ceil((s.buffs.gun - time)/1000)}`);
                    if (s.buffs.spike > time) aIcons.push(`✹ ${Math.ceil((s.buffs.spike - time)/1000)}`);

                    if (aIcons.length > 0) {
                        ctx.font = 'bold 40px Arial'; ctx.fillStyle = '#ffff00';
                        aIcons.forEach((text, idx) => { let yPos = s.y - s.radius - 40 - (idx * 45); ctx.strokeText(text, s.x, yPos); ctx.fillText(text, s.x, yPos); });
                    }
                });
            } catch (e) {
                console.error("Rendering critical error: ", e);
            } finally {
                ctx.restore();
            }

            if (isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "bold 60px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.shadowBlur = 10; ctx.shadowColor = "black"; ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2); ctx.shadowBlur = 0; 
            }
        }

        function hostGameLoop() {
            try {
                updateHostLogic(); 
                renderClient();    
            } catch (e) {
                console.error("Game Loop Crashed: ", e);
            }
            if (gameMode !== 'client' && isPlaying) {
                gameLoopId = requestAnimationFrame(hostGameLoop);
            }
        }

        function updateLeaderboard(snakesArray) {
            if(!snakesArray) return;
            let sorted = [...snakesArray].sort((a, b) => b.score - a.score);
            const maxDisp = (window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) ? 4 : 10;
            let html = '';
            for (let i = 0; i < Math.min(maxDisp, sorted.length); i++) {
                const s = sorted[i];
                if(!s) continue;
                const myName = document.getElementById('nickname').value || 'Player';
                let rankClass = '';
                if (s.name === myName) rankClass = 'class="my-rank"';
                else if (s.isPlayer) rankClass = 'class="remote-rank"';
                html += `<li ${rankClass}>${s.name} <small>(${Math.floor(s.score)})</small></li>`;
            }
            leaderboardList.innerHTML = html;
        }
    });
</script>
</body>
</html>
